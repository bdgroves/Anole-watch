name: Update occurrences

on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: false
      - run: pixi run fetch
      - name: Commit data
        run: |
          git config user.name "anole-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/occurrences.geojson
          git diff --cached --quiet || git commit -m "data: weekly GBIF refresh"
          git push
